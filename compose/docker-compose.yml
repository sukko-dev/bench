# Benchmark stack. Two ws-server replicas behind Docker DNS round-robin (the
# same HA shape as a Kubernetes Service — the gateway proxies to the "ws-server"
# name, Docker load-balances across replicas; a killed replica drops its
# clients, who reconnect and land on the survivor). Shared Valkey broadcast bus
# + Kafka consumer group keep both replicas delivering the same stream.
#
# ws-server publishes NO host ports, so it can scale to N replicas
# (docker compose up --scale ws-server=2). Only the gateway is reachable from
# the host — the driver connects there.
#
# Images are the RELEASED, DIGEST-PINNED public v1.0.2 images (ADR-0012:
# official numbers only from pinned public images). The SUKKO_IMAGE_* env vars
# override them for a future release; the pinned digests below are the default.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sukko
      POSTGRES_PASSWORD: sukko
      POSTGRES_DB: sukko
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukko"]
      interval: 3s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:7.2-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  provisioning:
    image: ${SUKKO_IMAGE_PROVISIONING:-ghcr.io/sukko-dev/sukko-provisioning@sha256:8beb0154675e169b4e0bcb4699bbf2f9209a728f3d0e692a20916aa31291f2e3}
    # REST API exposed so bootstrap.sh can provision the bench tenant + token
    # from the host. Not on the message path — the driver only talks to the gateway.
    ports:
      - "18080:8080"
    environment:
      ADMIN_BOOTSTRAP_KEY: "${ADMIN_BOOTSTRAP_KEY:-}"
      # Defaults to the committed prod-signed bench Community key (ADR-0038: Community now
      # requires an account-issued key — an empty key is refused at startup). NOT a secret:
      # a Community key unlocks only the free tier, and it verifies against the production
      # key embedded in the published images. Override by exporting SUKKO_LICENSE_KEY (e.g. a
      # dev Pro key with source-built sukko_e2e images for the Pro SSE matrix, ADR-0030).
      SUKKO_LICENSE_KEY: "${SUKKO_LICENSE_KEY:-.e0nWF3QBfUHubE8_KvGmIfAV0jGT_ZR0hyt0qDKiMcDvNfeucuD9kuGTSey2d1wIR3o_5XP5BZWKwpenHwTQfA}"
      # Pro/Enterprise editions require these two (webhooks are Pro-gated); empty is fine on
      # Community. The bench runs no webhook-worker and exercises no webhooks — they exist only
      # to satisfy Pro config validation for the SSE matrix. The worker addr is dialed lazily
      # (grpc.NewClient), so an unreachable placeholder never fails startup.
      WEBHOOK_INTERNAL_TOKEN: "${WEBHOOK_INTERNAL_TOKEN:-}"
      WEBHOOK_WORKER_GRPC_ADDR: "${WEBHOOK_WORKER_GRPC_ADDR:-}"
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:-}"
      DATABASE_URL: "postgres://sukko:sukko@postgres:5432/sukko?sslmode=disable"
      KAFKA_TOPIC_NAMESPACE: "local"
      PROVISIONING_VALKEY_ADDRS: "valkey:6379"
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # No host ports → scalable. `docker compose up --scale ws-server=2`.
  ws-server:
    image: ${SUKKO_IMAGE_SERVER:-ghcr.io/sukko-dev/sukko-server@sha256:560f234b2f2aa4c476a7db0c9308da64f16e4496b9d89dab90afcd26adbdeb4f}
    environment:
      - VALKEY_ADDRS=valkey:6379
      - PROVISIONING_GRPC_ADDR=provisioning:9090
      # Empty ⇒ Community (the WS fault matrix runs license-free, ADR-0009). Set to a
      # signed token ⇒ Pro, which unlocks the Pro-gated SSE transport for the SSE
      # fault matrix (ADR-0030). Verified against the license key baked into the
      # image, so a dev-minted token requires a source-built image.
      # Same committed Community key default as provisioning above (ADR-0038).
      - SUKKO_LICENSE_KEY=${SUKKO_LICENSE_KEY:-.e0nWF3QBfUHubE8_KvGmIfAV0jGT_ZR0hyt0qDKiMcDvNfeucuD9kuGTSey2d1wIR3o_5XP5BZWKwpenHwTQfA}
      - MESSAGE_BACKEND=kafka
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC_NAMESPACE=local
      # History/replay ON — the recovery claim (C2/C3) exercises it.
      - WS_HISTORY_ENABLED=true
      # Kafka consume ceiling, raised above the workload peak for the same reason
      # the gateway's publish admission is (METHODOLOGY §4). The stock default is
      # 1,000 msg/s, which sits UNDER the ×8 burst peak of ~1,920 msg/s: the
      # publisher is admitted at the gateway and the consumer then drops the
      # excess, so acknowledged publishes never reach subscribers and the
      # zero-loss checker reports holes confined to the burst windows.
      - WS_MAX_KAFKA_RATE=2500
      # Pod identity must differ per replica for the connections registry; the
      # hostname is unique per replica, so derive it from that.
      - WS_POD_ID={{.Task.Name}}
    depends_on:
      valkey: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      provisioning: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ws-gateway:
    image: ${SUKKO_IMAGE_GATEWAY:-ghcr.io/sukko-dev/sukko-gateway@sha256:5872a69d2be6a63774c3053806e0256509fa0f3085e68c314b84b8a3e44cdf24}
    ports:
      - "3000:3000"
    environment:
      # Same committed Community key default as provisioning above (ADR-0038); override to a
      # Pro key (with source-built sukko_e2e images) to unlock the SSE transport (ADR-0030).
      SUKKO_LICENSE_KEY: "${SUKKO_LICENSE_KEY:-.e0nWF3QBfUHubE8_KvGmIfAV0jGT_ZR0hyt0qDKiMcDvNfeucuD9kuGTSey2d1wIR3o_5XP5BZWKwpenHwTQfA}"
      GATEWAY_BACKEND_URL: "ws://ws-server:3005/ws"
      SERVER_GRPC_ADDR: "ws-server:3006"
      # Tenant JWT signing keys, API keys and revocations reach the gateway ONLY over
      # this stream — without it every token fails "unverifiable" and the gateway
      # retries a dead [::1]:9090 forever.
      PROVISIONING_GRPC_ADDR: "provisioning:9090"
      # DISCLOSED deviation from stock defaults (see METHODOLOGY.md): the default
      # publish admission limit (10 msg/s per principal) is an anti-abuse control,
      # not pipeline capacity, and the whole bench publishes as ONE principal. The
      # bench measures the delivery pipeline, so admission is raised above the
      # odds-burst peak (~1,920 msg/s) — via ordinary operator env config available
      # on every edition, so a Community operator can reproduce this exactly.
      GATEWAY_PUBLISH_RATE_LIMIT: "2500"
      GATEWAY_PUBLISH_BURST: "5000"
    depends_on:
      ws-server: { condition: service_healthy }
      provisioning: { condition: service_healthy }
